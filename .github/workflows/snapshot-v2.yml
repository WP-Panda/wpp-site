name: Снапшот вёрстки v2.wp-panda.pro

on:
  push:
    branches: ['**']
    paths: ['.github/workflows/snapshot-v2.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Обойти сайт и сохранить HTML
        run: python3 .github/scripts/snapshot-v2.py

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: markup-v2
          path: markup-v2/

      - name: Закоммитить снапшот
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add markup-v2
          git commit -m "Снапшот вёрстки v2.wp-panda.pro (${{ github.run_id }})"
          git push origin HEAD:${{ github.ref_name }}
